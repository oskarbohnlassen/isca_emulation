model:
  model_type: SimpleCNN2D
  hidden_dim: 1024
  kernel_size: 5
  padding_type: lonlat
  activation: silu
  use_batch_norm: false
  num_layers: 6
train:
  scheduler: ExponentialLR
  optimizer: Adam
  loss_fn: MSELoss
  lr: 0.0001
  weight_decay: 0.0001
  batch_size: 5
  cache_in_memory: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  epochs: 50
  device: cuda
  random_seed: 46
  early_stopping: false
  early_stopping_patience: 10
  metrics_every_n_epochs: 1
wandb:
  project_name: isca_grl_rebuttal
  save_data: false
  append_model_type_to_name: true
  save_model_threshold: 800
  sweep:
    enabled: false
path_to_processed_data: cnn2d_coordinates_trig4_1000_to_3500_postprocessed_with_ssw
