model:
  activation: gelu
  bottleneck_dilation: 3
  down_sample_method: strided_conv
  hidden_dim_base: 40
  model_type: UnetCNN3D_Fixed
  padding_type: lonlat
  use_batch_norm: false
train:
  batch_size: 5
  cache_in_memory: false
  device: cuda
  early_stopping: false
  early_stopping_patience: 10
  epochs: 50
  loss_fn: L1Loss
  lr: 0.0005
  metrics_every_n_epochs: 1
  num_workers: 0
  optimizer: Adam
  persistent_workers: false
  pin_memory: false
  prefetch_factor: 2
  random_seed: 42
  scheduler: ExponentialLR
  weight_decay: 0.0001
wandb:
  project_name: isca_grl_rebuttal
  save_data: false
  append_model_type_to_name: true
  save_model_threshold: 800
  sweep:
    enabled: false
path_to_processed_data: cnn3d_coordinates_trig4_1000_to_3500_postprocessed_no_ssw
