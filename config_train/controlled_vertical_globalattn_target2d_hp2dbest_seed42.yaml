# Controlled vertical sensitivity experiment; approved dimensional mappings.
# HP source: grl_seed42_with_ssw_transformer2d_global_attention.yaml; sweep rank is not independently verified here.
model:
  model_type: Transformer2DGlobalAttentionForecaster
  hidden_dim: 1024
  patch_height: 4
  patch_width: 2
  num_layers: 10
  num_heads: 8
  mlp_ratio: 8.0
  activation: gelu
  dropout: 0
  attention_dropout: 0
train:
  scheduler: OneCycleLR
  optimizer: AdamW
  loss_fn: SmoothL1Loss
  lr: 0.0005
  weight_decay: 0.0005
  batch_size: 5
  cache_in_memory: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  epochs: 50
  device: cuda
  random_seed: 42
  early_stopping: false
  early_stopping_patience: 10
  metrics_every_n_epochs: 1
wandb:
  project_name: isca_grl_rebuttal
  save_data: false
  append_model_type_to_name: false
  save_model_threshold: 800
  sweep:
    enabled: false
path_to_processed_data: cnn2d_coordinates_trig4_1000_to_3500_postprocessed_with_ssw
