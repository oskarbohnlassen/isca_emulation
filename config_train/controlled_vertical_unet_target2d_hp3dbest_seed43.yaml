# Controlled vertical sensitivity experiment; approved dimensional mappings.
# HP source: grl_seed42_with_ssw_cnn3d_unet.yaml; sweep rank is not independently verified here.
model:
  model_type: UnetCNN2D_Fixed
  hidden_dim_base: 50
  down_sample_method: pool_mean
  bottleneck_dilation: 2
  activation: gelu
  padding_type: lonlat
  use_batch_norm: false
train:
  scheduler: ExponentialLR
  optimizer: Adam
  loss_fn: SmoothL1Loss
  lr: 0.0005
  weight_decay: 0.0001
  batch_size: 5
  cache_in_memory: false
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  epochs: 50
  device: cuda
  random_seed: 43
  early_stopping: false
  early_stopping_patience: 10
  metrics_every_n_epochs: 1
wandb:
  project_name: isca_grl_rebuttal
  save_data: false
  append_model_type_to_name: false
  save_model_threshold: 800
  sweep:
    enabled: false
path_to_processed_data: cnn2d_coordinates_trig4_1000_to_3500_postprocessed_with_ssw
